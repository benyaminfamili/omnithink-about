<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Omnis">
  <defs>
    <linearGradient id="omnisRim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="0.5" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <radialGradient id="omnisFace" cx="0.5" cy="0.42" r="0.7">
      <stop offset="0" stop-color="#2a2a30"/>
      <stop offset="1" stop-color="#141417"/>
    </radialGradient>
    <radialGradient id="omnisGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#bfdbfe"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- coin edge -->
  <circle cx="256" cy="256" r="248" fill="url(#omnisRim)"/>
  <!-- face -->
  <circle cx="256" cy="256" r="216" fill="url(#omnisFace)"/>
  <!-- inner mint ring -->
  <circle cx="256" cy="256" r="198" fill="none" stroke="#3b82f6" stroke-opacity="0.35" stroke-width="4"/>
  <!-- five strands, one per model, converging on one answer -->
  <g>
    <path d="M 96.5 181.6 Q 157.1 235.9 256 332" fill="none" stroke="#34d399" stroke-width="30" stroke-linecap="round"/>
    <path d="M 161.4 107.6 Q 197.4 190.0 256 332" fill="none" stroke="#3b82f6" stroke-width="30" stroke-linecap="round"/>
    <path d="M 256.0 80.0 Q 256.0 172.9 256 332" fill="none" stroke="#a78bfa" stroke-width="30" stroke-linecap="round"/>
    <path d="M 350.6 107.6 Q 314.6 190.0 256 332" fill="none" stroke="#ec4899" stroke-width="30" stroke-linecap="round"/>
    <path d="M 415.5 181.6 Q 354.9 235.9 256 332" fill="none" stroke="#f59e0b" stroke-width="30" stroke-linecap="round"/>
  </g>
  <!-- convergence glow + point -->
  <circle cx="256" cy="332" r="56" fill="url(#omnisGlow)" opacity="0.9"/>
  <circle cx="256" cy="332" r="24" fill="#ffffff"/>
</svg>
